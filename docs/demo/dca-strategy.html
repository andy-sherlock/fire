<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>定投策略预览</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 布局：左边一部"手机"演示定投页面，右边说明和模拟控制；窄屏上下排 */
:root {
  --bg: #eef1ee; --surface: #ffffff; --ink: #17221e; --muted: #5d6b65; --line: #d5ddd8;
  --accent: #0f6b5c; --accent-soft: #dcefe9; --warn: #a8661a; --warn-soft: #f6ead9; --phone: #1d2925;
  --f-display: "Noto Serif SC", "Songti SC", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111816; --surface: #19221f; --ink: #e6ece9; --muted: #9aa8a2; --line: #2c3833;
    --accent: #5cc4ae; --accent-soft: #1d3a33; --warn: #e0a75c; --warn-soft: #3a2e1f; --phone: #050807; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111816; --surface: #19221f; --ink: #e6ece9; --muted: #9aa8a2; --line: #2c3833;
  --accent: #5cc4ae; --accent-soft: #1d3a33; --warn: #e0a75c; --warn-soft: #3a2e1f; --phone: #050807; color-scheme: dark;
}
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); line-height: 1.6; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 28px 48px; }
header h1 { font-family: var(--f-display); font-weight: 900; font-size: 1.9rem; margin: 0; text-wrap: balance; }
header p { color: var(--muted); margin: 6px 0 0; max-width: 62ch; }
.tag { display: inline-block; font-size: .75rem; letter-spacing: .08em; color: var(--warn); background: var(--warn-soft); padding: 2px 8px; border-radius: 4px; margin-bottom: 8px; }
.layout { display: grid; grid-template-columns: 390px 1fr; gap: 40px; margin-top: 28px; align-items: start; }
@media (max-width: 880px) { .layout { grid-template-columns: 1fr; gap: 28px; } }
.phone { background: var(--phone); border-radius: 40px; padding: 12px; max-width: 390px; width: 100%; margin: 0 auto; box-shadow: 0 20px 50px rgba(0,0,0,.18); position: relative; }
.screen { background: var(--surface); border-radius: 30px; height: 700px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
.scroll { flex: 1; overflow-y: auto; padding: 14px 18px 10px; display: flex; flex-direction: column; gap: 14px; }
.statusbar { display: flex; justify-content: space-between; font-family: var(--f-num); font-size: .78rem; color: var(--muted); padding: 14px 22px 0; }
.tabs { display: flex; border-top: 1px solid var(--line); }
.tabs button { flex: 1; font: inherit; font-size: .85rem; background: none; border: 0; color: var(--muted); padding: 10px 0 14px; cursor: pointer; }
.tabs button[aria-pressed="true"] { color: var(--accent); font-weight: 700; }
h2 { font-size: .78rem; letter-spacing: .1em; color: var(--muted); margin: 0; font-weight: 500; }
.card { border-radius: 18px; padding: 16px; color: #fff; display: flex; flex-direction: column; gap: 6px; }
.card .zone { font-family: var(--f-display); font-weight: 900; font-size: 1.7rem; line-height: 1.2; }
.card .meta { font-size: .85rem; opacity: .92; }
.pe { display: flex; align-items: center; gap: 8px; font-size: .85rem; }
.pe input { width: 70px; font: inherit; font-family: var(--f-num); font-size: 1rem; padding: 2px 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,.6); background: rgba(255,255,255,.15); color: #fff; }
.buy { background: var(--bg); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.buy .big { font-family: var(--f-display); font-weight: 900; font-size: 1.5rem; }
.row { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; }
.row b { font-family: var(--f-num); font-weight: 500; }
.muted { color: var(--muted); }
.btn { font: inherit; font-weight: 700; background: var(--accent); color: var(--surface); border: 0; border-radius: 12px; padding: 11px 16px; cursor: pointer; }
.btn.ghost { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
.btn:focus-visible, .tabs button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.pool { border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.pool .total { border-top: 1px solid var(--line); margin-top: 4px; padding-top: 6px; font-weight: 700; }
table { width: 100%; border-collapse: collapse; font-size: .8rem; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 4px; border-bottom: 1px solid var(--line); }
th { color: var(--muted); font-weight: 500; }
.chip { display: inline-block; color: #fff; border-radius: 4px; padding: 0 6px; font-size: .75rem; white-space: nowrap; }
.src { font-size: .72rem; padding: 0 5px; border-radius: 4px; background: var(--accent-soft); color: var(--accent); }
.src.m { background: var(--warn-soft); color: var(--warn); }
.modal { position: absolute; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: flex-end; }
.sheet { background: var(--surface); width: 100%; border-radius: 22px 22px 0 0; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.sheet h3 { margin: 0; font-family: var(--f-display); }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { display: grid; grid-template-columns: 5.5em 1fr; align-items: center; font-size: .85rem; color: var(--muted); gap: 8px; }
.field input, .sheet input[type=text] { font: inherit; font-family: var(--f-num); padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); min-width: 0; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; font-size: .8rem; }
.cal .wd { color: var(--muted); font-size: .72rem; }
.cal button { font: inherit; height: 38px; border-radius: 10px; border: 0; background: transparent; color: var(--ink); cursor: pointer; padding: 0; min-width: 0; }
.cal button.done { color: #fff; font-weight: 700; }
.cal button.miss { box-shadow: inset 0 0 0 2px var(--b); color: var(--b); font-weight: 700; }
.cal button.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.cal button { position: relative; }
.cal button.has-m::after { content: ""; position: absolute; bottom: 5px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--muted); }
.cal button.done.has-m::after { background: #fff; }
.funds { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.funds > div { border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.funds .v { font-family: var(--f-display); font-weight: 900; font-size: 1.35rem; }
.funds small { color: var(--muted); font-size: .72rem; line-height: 1.4; }
.calhead { display: flex; justify-content: space-between; align-items: center; }
.calhead button { font: inherit; background: none; border: 1px solid var(--line); border-radius: 8px; color: var(--ink); padding: 2px 10px; cursor: pointer; }
.legend { display: flex; gap: 12px; font-size: .75rem; color: var(--muted); flex-wrap: wrap; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; }
.detail { background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: .85rem; display: flex; flex-direction: column; gap: 2px; }
.cmp { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; }
.cmp svg { width: 100%; height: auto; }
.cmp .opts { display: flex; gap: 8px; flex-wrap: wrap; }
.cmp .opts button { font: inherit; font-size: .85rem; border: 1px solid var(--line); background: var(--surface); color: inherit; border-radius: 999px; padding: 5px 12px; cursor: pointer; }
.cmp .opts button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.nums { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.nums div { background: var(--bg); border-radius: 10px; padding: 10px 12px; font-size: .85rem; }
.nums b { display: block; font-family: var(--f-num); font-size: 1.1rem; }
.panel { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
.panel h3 { font-family: var(--f-display); font-size: 1.15rem; margin: 0 0 8px; }
.explain { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
.explain p { margin: 0 0 8px; max-width: 62ch; }
.explain p:last-child { margin-bottom: 0; }
.explain ul { margin: 0; padding-left: 1.2em; }
.ctrl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.ctrl input[type=range] { flex: 1; min-width: 160px; accent-color: var(--accent); }
.ctrl b { font-family: var(--f-num); }
</style>

<div class="wrap">
  <header>
    <span class="tag">示例数据 · 不是你的真实数字</span>
    <h1>定投策略预览</h1>
    <p>按你的六档 PE 策略做的样子。点手机底部切换"本周 / 记录 / 策略"三个页面；右边可以拖动 PE，看不同档位下本周卡片怎么变。</p>
  </header>

  <div class="layout">
    <div class="phone">
      <div class="screen" id="screen">
        <div class="statusbar"><span>9:41</span><span>定投</span></div>
        <div class="scroll" id="view"></div>
        <nav class="tabs" id="tabs">
          <button type="button" id="tab-week" data-v="week">本周</button>
          <button type="button" id="tab-log" data-v="log">记录</button>
          <button type="button" id="tab-plan" data-v="plan">策略</button>
        </nav>
        <div id="modal"></div>
      </div>
    </div>

    <div class="panel">
      <section>
        <h3>模拟本周 PE</h3>
        <div class="ctrl"><input type="range" id="pe-range" min="20" max="45" step="0.1" value="30.4" aria-label="本周 PE"><b id="pe-show">30.4</b></div>
        <p class="muted" style="font-size:.85rem;margin:6px 0 0">真实使用时，PE 由你每周填一次（第 1 期），或以后自动获取。</p>
      </section>
      <section class="explain" id="explain"></section>
    </div>
  </div>
</div>

<script>
const BASE = 125;
const PRICE = { VOO: 560.20, QQQM: 221.40 };
const BANDS = [
  { min: 40,  max: Infinity, name: "高危禁区", color: "#b42318", t: null,   m: 0 },
  { min: 35,  max: 40,  name: "虚高警戒", color: "#b54708", t: "VOO",  m: 0.6 },
  { min: 32,  max: 35,  name: "均衡配置", color: "#8a6100", t: "VOO",  m: 1 },
  { min: 28,  max: 32,  name: "价值洼地", color: "#1f7a3d", t: "QQQM", m: 1.5 },
  { min: 25,  max: 28,  name: "超值猎场", color: "#0e6b80", t: "QQQM", m: 2 },
  { min: -Infinity, max: 25, name: "黄金大底", color: "#1d4ed8", t: "QQQM", m: 2.5, clear: true }
];
// PE 恰好等于边界时按较低区间：区间为 (min, max]
const bandOf = pe => BANDS.find(b => pe > b.min && pe <= b.max);
const usd = n => "$" + Math.round(n).toLocaleString("en-US");
const usd2 = n => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });

const state = {
  view: "week",
  pe: 30.4,
  lastPe: 31.2,
  account: 50000,   // 账户里的可用资金，不属于策略
  mode: "adv",
  weeks: 5,          // 已经过去的计划周数（不含本周）
  topup: 0,
  log: [
    { m: 10, d: 29, band: "价值洼地", color: "#1f7a3d", t: "QQQM", plan: 187, actual: 0 },
    { m: 10, d: 22, band: "均衡配置", color: "#8a6100", t: "VOO", plan: 125, actual: 125.9 },
    { m: 10, d: 15, band: "均衡配置", color: "#8a6100", t: "VOO", plan: 125, actual: 125.6 },
    { m: 10, d: 8,  band: "虚高警戒", color: "#b54708", t: "VOO", plan: 75,  actual: 75.4 },
    { m: 10, d: 1,  band: "虚高警戒", color: "#b54708", t: "VOO", plan: 75,  actual: 75.2 }
  ],
  manual: [ { date: "10/20", what: "MSFT 0.5 股", amt: 210.5 } ],
  calMonth: 10,
  sel: null,
  doneThisWeek: false
};
const invested = () => state.log.reduce((s, r) => s + r.actual, 0);
const plannedFunds = () => (state.weeks + (state.doneThisWeek ? 1 : 0)) * BASE;
const reserve = () => plannedFunds() + state.topup - invested();

function plan() {
  const b = bandOf(state.pe);
  const r = reserve();
  let amt = Math.floor(BASE * b.m);
  if (b.clear) amt += Math.floor(r);
  return { b, amt, shares: b.t ? Math.floor(amt / PRICE[b.t] * 100) / 100 : 0 };
}

const view = document.getElementById("view");
const modal = document.getElementById("modal");
const explain = document.getElementById("explain");

function render() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === state.view));
  modal.innerHTML = "";
  if (state.view === "week") renderWeek();
  if (state.view === "log") renderLog();
  if (state.view === "plan") renderPlan();
}

function renderWeek() {
  const { b, amt, shares } = plan();
  const chg = BASE - Math.floor(BASE * b.m);
  const n = state.weeks + (state.doneThisWeek ? 1 : 0);
  view.innerHTML = `
    <div class="card" style="background:${b.color}">
      <span class="meta">本周四 · 11 月 5 日</span>
      <span class="zone">${b.name}</span>
      <label class="pe" for="pe-in">纳指 100 PE
        <input id="pe-in" type="number" step="0.1" value="${state.pe}">
      </label>
      <span class="meta">来源：StockAnalysis · 周三收盘</span>
    </div>
    ${state.doneThisWeek ? `<div class="buy"><b>✓ 本周已记录</b><span class="muted">在"记录"的日历里可以查看</span></div>` :
    b.t ? `<div class="buy">
      <span class="big">${b.t} ${usd(amt)}</span>
      <span class="muted">≈ ${shares} 股（按 ${usd2(PRICE[b.t])}） · ${b.clear ? "结余全部投入 " + usd(reserve()) : chg >= 0 ? "存进结余 " + usd(chg) : "从结余取 " + usd(-chg)}</span>
    </div>
    <button class="btn" id="bought" type="button">我已买入</button>` :
    `<div class="buy"><span class="big">本周不买</span><span class="muted">$125 全部存进结余</span></div>
     <button class="btn ghost" id="bought" type="button">记下本周不买</button>`}
    <div class="funds">
      <div><span class="muted" style="font-size:.8rem">策略结余</span><span class="v">${usd(reserve())}</span>
        <small>预算累计 ${usd(plannedFunds())}（${n} 周）<br>已投入 ${usd(invested())}${state.topup ? "<br>补足 " + usd(state.topup) : ""}</small></div>
      <div><span class="muted" style="font-size:.8rem">账户可用资金</span><span class="v">${usd(state.account)}</span>
        <small>转进券商还没用的钱，不属于策略；结余不够时才问你要不要用</small></div>
    </div>`;
  document.getElementById("pe-in").addEventListener("change", e => setPe(+e.target.value, true));
  const bt = document.getElementById("bought");
  if (bt) bt.addEventListener("click", openBuy);
  explain.innerHTML = `<p><b>本周页面</b>：一屏看完，不用上下滑。</p>
    <ul><li>彩色卡片：这周是哪一档、PE、来源</li>
    <li>中间：本周买什么、多少钱、约几股，结余怎么变，加一个"我已买入"按钮</li>
    <li>底部左右两格：<b>策略结余</b>（只来自每周预算）和<b>账户可用资金</b>（你转进来的钱，不属于策略）</li></ul>`;
}

function renderLog() {
  const m = state.calMonth;
  const first = new Date(2026, m - 1, 1).getDay();
  const days = new Date(2026, m, 0).getDate();
  const byDay = {}; state.log.filter(r => r.m === m).forEach(r => byDay[r.d] = r);
  const man = {}; state.manual.filter(x => +x.date.split("/")[0] === m).forEach(x => { const d = +x.date.split("/")[1]; (man[d] = man[d] || []).push(x); });
  let cells = ["一","二","三","四","五","六","日"].map(w => `<span class="wd">${w}</span>`).join("");
  for (let i = 0; i < (first + 6) % 7; i++) cells += "<span></span>";
  for (let d = 1; d <= days; d++) {
    const r = byDay[d], mm = man[d];
    if (!r && !mm) { cells += `<button type="button" disabled>${d}</button>`; continue; }
    const done = r && (r.actual > 0 || r.plan === 0);
    const cls = [r ? (done ? "done" : "miss") : "", mm ? "has-m" : ""].join(" ");
    cells += `<button type="button" data-d="${d}" class="${cls}" style="${r ? `--b:${r.color};${done ? `background:${r.color}` : ""}` : ""}">${d}</button>`;
  }
  const done = state.log.filter(x => x.actual > 0 || x.plan === 0).length;
  view.innerHTML = `
    <div class="calhead"><button type="button" id="prev" aria-label="上个月">‹</button><h2>2026 年 ${m} 月</h2><button type="button" id="next" aria-label="下个月">›</button></div>
    <div class="cal">${cells}</div>
    <div class="legend"><span><i style="background:#1f7a3d"></i>已买入（颜色 = 档位）</span><span><i style="box-shadow:inset 0 0 0 2px #1f7a3d"></i>计划了没买</span><span><i style="background:var(--muted);border-radius:50%;width:6px;height:6px"></i>其他投资</span></div>
    <p class="muted" style="margin:0;font-size:.85rem">今年执行了 ${done + 38} / ${state.log.length + 38} 周（示例）</p>
    <button class="btn ghost" id="manual" type="button">＋ 记一笔其他投资</button>`;
  document.getElementById("manual").addEventListener("click", openManual);
  document.getElementById("prev").onclick = () => { state.calMonth = Math.max(10, m - 1); render(); };
  document.getElementById("next").onclick = () => { state.calMonth = Math.min(11, m + 1); render(); };
  view.querySelectorAll(".cal button[data-d]").forEach(btn => btn.onclick = () => openDay(m, +btn.dataset.d, byDay[+btn.dataset.d], man[+btn.dataset.d]));
  explain.innerHTML = `<p><b>记录页面</b>：只有一个日历。</p>
    <ul><li>定投日涂上档位颜色：实心是买了，空心是计划了没买</li>
    <li>不走策略、自己记的投资，在那天下面加一个小圆点</li>
    <li>点有颜色或有圆点的日子，弹出那天的详细内容</li></ul>`;
}

function openDay(m, d, r, mm) {
  const chg = r ? BASE - (r.actual > 0 || r.plan === 0 ? r.plan : 0) : 0;
  modal.innerHTML = `<div class="modal"><div class="sheet">
    <h3>${m} 月 ${d} 日</h3>
    ${r ? `<div class="detail">
      <b><span class="chip" style="background:${r.color}">${r.band}</span> 定投</b>
      <div class="row"><span>计划</span><b>${r.t} ${usd(r.plan)}</b></div>
      <div class="row"><span>实际</span><b>${r.actual ? usd2(r.actual) : "没买"}</b></div>
      ${r.actual && r.t !== "—" ? `<div class="row"><span>约合</span><b>${(Math.floor(r.actual / PRICE[r.t] * 100) / 100)} 股</b></div>` : ""}
      <div class="row"><span>结余变化</span><b>${chg >= 0 ? "+" : "−"}${usd(Math.abs(chg))}</b></div></div>` : ""}
    ${(mm || []).map(x => `<div class="detail"><b>其他投资</b><div class="row"><span>${x.what}</span><b>${usd2(x.amt)}</b></div></div>`).join("")}
    <button class="btn ghost" id="d-close" type="button">关闭</button>
  </div></div>`;
  document.getElementById("d-close").onclick = () => { modal.innerHTML = ""; };
}

function renderPlan() {
  const adv = state.mode === "adv";
  const rows = BANDS.map(b => `<tr><td>${b.min === -Infinity ? "≤ 25" : b.max === Infinity ? "> 40" : `${b.min}–${b.max}`}</td><td><span class="chip" style="background:${b.color}">${b.name}</span></td><td>${b.t || "—"}</td><td>${b.m}×${b.clear ? " + 清空结余" : ""}</td></tr>`).join("");
  view.innerHTML = `
    <h2>我的策略</h2>
    <div class="cmp" style="padding:4px;border:0"><div class="opts">
      <button type="button" id="m-simple" aria-pressed="${!adv}">普通定投</button>
      <button type="button" id="m-adv" aria-pressed="${adv}">高级：按估值分档</button>
    </div></div>
    <div class="pool">
      <div class="row"><span>每周预算</span><b>$125（约每月 ¥3,900）</b></div>
      <div class="row"><span>频率</span><b>每周四（休市顺延）</b></div>
      ${adv ? `<div class="row"><span>参考指标</span><b>纳指 100 PE</b></div>
      <div class="row"><span>PE 来源</span><b>待定</b></div>` : `<div class="row"><span>买什么</span><b>QQQM 100%</b></div>`}
    </div>
    ${adv ? `<table><thead><tr><th>PE</th><th>档位</th><th>买入</th><th>倍数</th></tr></thead><tbody>${rows}</tbody></table>
    <p class="muted" style="margin:0;font-size:.8rem">PE 等于分界线时按较低一档；金额往下取整，零头留在结余；结余不够时再问。</p>` :
    `<p class="muted" style="margin:0;font-size:.85rem">每周固定投 $125，按比例买。不看估值，没有结余。想买几只就加几行比例。</p>`}
    <button class="btn ghost" type="button">编辑策略</button>`;
  document.getElementById("m-simple").onclick = () => { state.mode = "simple"; render(); };
  document.getElementById("m-adv").onclick = () => { state.mode = "adv"; render(); };
  explain.innerHTML = `<p><b>策略页面</b>：分两种。</p>
    <ul><li><b>普通定投</b>：填每周多少钱、买哪几只、各占多少，就完了</li>
    <li><b>高级</b>：再选一个参考指标（纳指 100 PE，或者某只股票自己的 PE），填分档表；有结余</li>
    <li>可以同时有好几个策略，比如一个高级的买 QQQM，一个普通的买可口可乐</li></ul>`;
}

function openBuy() {
  const { b, amt, shares } = plan();
  if (!b.t) { record(0); return; }
  if (!b.clear && reserve() + BASE - amt < 0) return openShort(amt);
  modal.innerHTML = `<div class="modal"><div class="sheet">
    <h3>记下本周买入</h3>
    <span class="muted" style="font-size:.85rem">已经按计划填好，改成你实际成交的数字</span>
    <div class="field">
      <label for="f-sh">股数<input id="f-sh" type="number" step="0.01" value="${shares}"></label>
      <label for="f-px">成交价 $<input id="f-px" type="number" step="0.01" value="${PRICE[b.t]}"></label>
      <label for="f-fee">手续费 $<input id="f-fee" type="number" step="0.01" placeholder="0.00"></label>
    </div>
    <button class="btn" id="save" type="button">保存</button>
    <button class="btn ghost" id="cancel" type="button">取消</button>
  </div></div>`;
  document.getElementById("cancel").onclick = render;
  document.getElementById("save").onclick = () => {
    const a = (+document.getElementById("f-sh").value) * (+document.getElementById("f-px").value) + (+document.getElementById("f-fee").value || 0);
    record(a);
  };
}

function openShort(amt) {
  modal.innerHTML = `<div class="modal"><div class="sheet">
    <h3>结余不够</h3>
    <span>本周计划投 ${usd(amt)}，结余加本周资金只有 ${usd(reserve() + BASE)}。</span>
    <button class="btn" id="s-add" type="button">从账户资金里补足</button>
    <button class="btn ghost" id="s-cut" type="button">有多少投多少</button>
  </div></div>`;
}

function openManual() {
  modal.innerHTML = `<div class="modal"><div class="sheet">
    <h3>记一笔投资</h3>
    <label class="muted" for="m-what" style="font-size:.8rem">买了什么</label>
    <input id="m-what" type="text" placeholder="例如 AAPL">
    <div class="field">
      <label for="m-sh">股数<input id="m-sh" type="number" step="0.01"></label>
      <label for="m-px">成交价 $<input id="m-px" type="number" step="0.01"></label>
      <label for="m-fee">手续费 $<input id="m-fee" type="number" step="0.01"></label>
    </div>
    <button class="btn" id="m-save" type="button">保存</button>
    <button class="btn ghost" id="m-cancel" type="button">取消</button>
  </div></div>`;
  document.getElementById("m-cancel").onclick = render;
  document.getElementById("m-save").onclick = () => {
    const sh = +document.getElementById("m-sh").value, px = +document.getElementById("m-px").value;
    const what = document.getElementById("m-what").value || "未命名";
    if (sh && px) state.manual.unshift({ date: "11/05", what: `${what} ${sh} 股`, amt: sh * px + (+document.getElementById("m-fee").value || 0) });
    render();
  };
}

function record(actual) {
  const { b, amt } = plan();
  state.log.unshift({ m: 11, d: 5, band: b.name, color: b.color, t: b.t || "—", plan: amt, actual });
  state.doneThisWeek = true;
  state.view = "log"; state.calMonth = 11;
  render();
}

function setPe(v, fromInput) {
  if (fromInput && state.pe && Math.abs(v - state.pe) / state.pe > 0.2) {
    modal.innerHTML = `<div class="modal"><div class="sheet">
      <h3>确认一下</h3><span>PE 从 ${state.pe} 变成了 ${v}，变化超过 20%。确定吗？</span>
      <button class="btn" id="c-yes" type="button">确定</button><button class="btn ghost" id="c-no" type="button">改一下</button>
    </div></div>`;
    document.getElementById("c-yes").onclick = () => { applyPe(v); };
    document.getElementById("c-no").onclick = render;
    return;
  }
  applyPe(v);
}
function applyPe(v) {
  state.pe = Math.round(v * 10) / 10;
  document.getElementById("pe-range").value = state.pe;
  document.getElementById("pe-show").textContent = state.pe;
  if (!state.doneThisWeek) state.view = "week";
  render();
}

document.getElementById("tabs").addEventListener("click", e => {
  const v = e.target.dataset && e.target.dataset.v; if (!v) return;
  state.view = v; render();
});
document.getElementById("pe-range").addEventListener("input", e => applyPe(+e.target.value));
render();
</script>

</html>
